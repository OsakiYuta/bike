name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # vinext 静态导出会在产物中嵌套 basePath 目录（dist/client/bike），
      # 而 GitHub Pages 项目站的产物根目录即映射到 /bike/，
      # 因此以 dist/client/bike 作为站点根，并补入 404.html 与 .nojekyll。
      - run: cp dist/client/404.html dist/client/bike/ && touch dist/client/bike/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client/bike

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
